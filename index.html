<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misioneros Stella Maris</title>
<style>
:root{--blue:#2f7fd6;--celeste:#bfe3f7;--celeste2:#8fcdee;--fg:#1c1c1c;--mut:#8a949c;--bd:#cfd8de;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;line-height:1.6;color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:#fff}
body.login{background:linear-gradient(180deg,var(--celeste2),var(--celeste))}
main{width:100%;max-width:520px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:28px}
#lock h1{font-size:1.5rem;margin:0 0 6px;color:var(--blue)}
p.s{color:#5b6b75;margin:0 0 18px}
input,button{font:inherit;width:100%;padding:12px;border-radius:10px}
input{border:1px solid var(--celeste2);background:#f4fbff;color:var(--fg);margin-bottom:12px}
#go{border:0;background:var(--blue);color:#fff;cursor:pointer}
#err{color:#c0392b;margin:10px 0 0;min-height:1.2em;font-size:.9rem}
#view h1{font-size:1.6rem;margin:0 0 26px;color:var(--blue)}
#view h2{font-size:1.7rem;margin:0 0 16px;color:var(--fg);text-align:center}
.pic{display:block;width:100%;height:auto;border-radius:12px;margin:0 0 22px}
.v{border-left:4px solid var(--blue);padding:4px 0 4px 18px;margin:0 0 22px}
.v b{display:block;color:var(--blue);font-size:1rem}
.v span{font-size:1.2rem}
.out{display:block;margin:10px auto 0;width:auto;background:none;border:0;color:var(--mut);cursor:pointer;padding:8px 16px}
</style>
</head>
<body class="login">
<main>
<div class="card" id="lock">
<h1>Misionero ingresa tu clave para acceder</h1>
<p class="s">Escribe la clave para ver los textos.</p>
<input id="pw" type="password" placeholder="Clave" autocomplete="off">
<button id="go">Entrar</button>
<div id="err"></div>
</div>
<div class="card" id="view" hidden>
<h1>Misioneros Stella Maris</h1>
<h2>La Oración</h2>
<img class="pic" id="pic" alt="Jesús orando en Getsemaní">
<div id="list"></div>
<button class="out" id="out">Cerrar</button>
</div>
</main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
  return JSON.parse(new TextDecoder().decode(buf));
}
const $=id=>document.getElementById(id);
async function enter(){
  $('err').textContent='';
  try{
    const items=await unlock($('pw').value);
    const list=$('list');list.textContent='';
    items.forEach(i=>{
      const d=document.createElement('div');d.className='v';
      const b=document.createElement('b');b.textContent=i.ref;
      const s=document.createElement('span');s.textContent=i.text;
      d.append(b,s);list.append(d);
    });
    $('pic').src=PIC;
    document.body.classList.remove('login');
    $('lock').hidden=true;$('view').hidden=false;
  }catch(e){$('err').textContent='Clave incorrecta.';}
  $('pw').value='';
}
$('go').onclick=enter;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
$('out').onclick=()=>{$('view').hidden=true;$('lock').hidden=false;$('list').textContent='';$('pic').removeAttribute('src');document.body.classList.add('login');};
</script>
